# All hardcoded values live here. src/utils/config.py
# ---------------------------------------------------------

paths:
  raw_data: "data/raw/heart.csv"
  processed_dir: "data/processed"
  models_dir: "models/"
  figures_dir: "figures/"


# ---------------------------------------------------------
# Data split
# ---------------------------------------------------------

split:
  test_size: 0.20     #20% test
  val_size : 0.25     #25% validation
  random_state: 42
  target_column : "target"

# ---------------------------------------------------------
# Preprocessing
# ---------------------------------------------------------

preprocessing:
  zero_as_nan_col:
    - "chol"
    - "trestbps"
    - "thalach"
  imputer_strategy: "median"

# ---------------------------------------------------------
# Feature engineering
# ---------------------------------------------------------

features:
  engineering_inputs:
    - "oldpeak"
    - "thalach"
    - "age"
    - "trestbps"
    - "chol"
    - "exang"
    - "ca"

  selected:
    - "sex"
    - "cp" 
    - "thal"
    - "oldpeak"
    - "ca"

# ---------------------------------------------------------
# Models
# ---------------------------------------------------------

models:
  logistic_regression:
    needs_scaling: true
    grid:
      C: [0.01, 0.1, 1.0, 10.0]

  random_forest:
    needs_scaling: false
    grid:
      n_estimators: [100, 200, 300]
      max_depth: [5, 10, null]
      min_samples_split: [2,5]

  xgboost:
    needs_scaling: false
    grid:
      n_estimators: [50, 100, 200]
      max_depth: [2,3,4]
      learning_rate: [0.05, 0.1, 0.2]
      subsample: [0.8, 1.0]

# ---------------------------------------------------------
# Training
# ---------------------------------------------------------

training:
  cv_folds: 5
  scoring: "roc_auc"
  n_jobs: -1

# ---------------------------------------------------------
# Evaluation
# ---------------------------------------------------------

evaluation:
   overfitting_threshold: 0.05
   decision_threshold:    0.5


risk_bands:
  - level: LOW
    label: Low Risk
    max: 0.30
    recommendations:
      - "Continue routine cardiovascular health maintenance and periodic screening."
      - "Reinforce heart-healthy lifestyle measures (diet, activity, smoking cessation)."
      - "Monitor blood pressure and lipid profile at routine follow-up visits."
  - level: MODERATE
    label: Moderate Risk
    max: 0.50
    recommendations:
      - "Recommend clinical correlation and further evaluation as indicated."
      - "Consider referral to Cardiology if risk factors persist or worsen."
  - level: HIGH
    label: High Risk
    max: 1.0
    recommendations:
      - "Recommend prompt clinical evaluation."
      - "Consider referral to Cardiology."
      - "Correlate with ECG, biomarkers, echocardiography or stress testing as indicated."